[package]
name = "syspulse"
description = "SysPulse - multipurpose system monitor and utility for Ubuntu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
default-run = "syspulse"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
syspulse-core = { path = "../crates/core" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tauri = { version = "2.12.1", features = ["image-png", "tray-icon"] }
env_logger = "0.11.11"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
libc = "0.2.190"
tauri-plugin-notification = "2.5.1"
tauri-plugin-global-shortcut = "2.4.0"
