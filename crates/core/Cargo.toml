[package]
name = "syspulse-core"
description = "SysPulse core: OS-level metrics, GPU, hardware inventory and process management"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
sysinfo = "0.39.6"
nvml-wrapper = "0.13.0"
nix = { version = "0.31.3", features = ["signal", "user", "process"] }
libc = "0.2.190"
jwalk = "0.9.0"
trash = "5.2.9"
regex = "1.13.1"
serialport = "4.10.1"
gstreamer = { version = "0.25.4", features = ["v1_20"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "bmp"] }
